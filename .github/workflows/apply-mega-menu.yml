name: Apply mega menu contribution

on:
  push:
    branches:
      - feat/mega-menu-navbar

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mega-menu-navbar
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration changes
        run: |
          cat .github/apply-script-parts/part-* > /tmp/apply-mega-menu-contribution.mjs
          node /tmp/apply-mega-menu-contribution.mjs "$GITHUB_WORKSPACE"

      - name: Remove temporary automation
        run: |
          rm -rf .github/mega-menu-parts
          rm -rf .github/apply-script-parts
          rm .github/workflows/apply-mega-menu.yml

      - name: Commit contribution integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate mega menu navbar"
          git push origin feat/mega-menu-navbar
